name: iOS Tests

on:
  pull_request:

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode.app"

      - name: Run tests (Simulator)
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEST="platform=iOS Simulator,OS=latest,name=iPhone 16 Pro"
          if ! xcrun simctl list devices available | grep -F "iPhone 16 Pro (" >/dev/null; then
            DEST="platform=iOS Simulator,OS=latest,name=iPhone 16"
          fi
          if ! xcrun simctl list devices available | grep -F "iPhone 16 (" >/dev/null \
            && ! xcrun simctl list devices available | grep -F "iPhone 16 Pro (" >/dev/null; then
            DEST="platform=iOS Simulator,OS=latest,name=iPhone 15 Pro"
          fi
          echo "Using destination: ${DEST}"
          xcodebuild \
            -project "Whist20.xcodeproj" \
            -scheme "Whist20" \
            -destination "${DEST}" \
            test
